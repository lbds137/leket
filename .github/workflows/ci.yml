name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test

  # The extension smoke (test/smoke/smoke.mjs) in a Playwright Chromium: branded Chrome no
  # longer loads unpacked extensions. Playwright is pinned and run through npx, so the repo
  # keeps no dependencies; 1.64.1 ships Chromium revision 1248, the one the smoke was
  # written against. The smoke finds it in ~/.cache/ms-playwright on its own.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx -y playwright@1.64.1 install --with-deps chromium
      - run: npm run smoke
