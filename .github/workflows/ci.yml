name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm test

  # The extension smoke (test/smoke/smoke.mjs) in a Playwright Chromium: branded Chrome no
  # longer loads unpacked extensions. Playwright is pinned and run through npx, so the repo
  # keeps no dependencies; 1.64.1 ships Chromium revision 1248, the one the smoke was
  # written against, and the step after the install fails unless that is the build present
  # (the smoke itself takes the newest chromium-* in ~/.cache/ms-playwright).
  # Pinned to 24.04: the ubuntu-latest pool migrated to Ubuntu 26 (runner-images#14748)
  # and smoke's `install --with-deps` died in apt on it twice (DNS loss for the Ubuntu
  # mirrors); the workflow below was written and validated on 24.04.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npx -y playwright@1.64.1 install --with-deps chromium
      - name: The pinned Chromium is the one the smoke will find
        # the cache the smoke reads: PLAYWRIGHT_BROWSERS_PATH when set and not 0, else the default
        run: |
          C="${PLAYWRIGHT_BROWSERS_PATH:-0}"; [ "$C" = 0 ] && C="$HOME/.cache/ms-playwright"
          ls -d "$C"/chromium-*
          test "$(ls -d "$C"/chromium-* | wc -l)" = 1
          test -x "$C"/chromium-1248/chrome-linux64/chrome
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, and Chromium's
      # sandbox needs one ("No usable sandbox!"). Lifted on this throwaway runner, so the
      # browser runs sandboxed, as it does on a desktop, instead of with --no-sandbox
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run smoke
