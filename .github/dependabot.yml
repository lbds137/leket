version: 2
updates:
  # These PRs merge on green checks with no review, so each entry waits out the days in
  # which a hijacked release is usually caught. Security updates ignore the cooldown.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # One PR for every action bump: separate PRs that rewrite the same workflow file collide,
    # and the workflow token can't merge the rebased one (it lacks the workflows permission).
    groups:
      github-actions:
        patterns:
          - '*'
