<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discord tools</title>
<style>
:root{--bg:#fff;--fg:#1e1f22;--muted:#4e5058;--warn:#7d4600;--accent:#3945d1}
@media (prefers-color-scheme: dark){:root{--bg:#313338;--fg:#dbdee1;--muted:#bec5cd;--warn:#f5bc36;--accent:#b6beff}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;min-width:320px;max-width:420px}
main{padding:14px}
h1{font-size:16px;margin:0 0 4px}
.blurb{color:var(--muted);margin:0 0 10px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--muted);background:transparent;color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
.warn{color:var(--warn)}
ul{padding-left:18px;margin:6px 0}
li{margin:4px 0}
</style>
</head>
<body>
<main><div id="card"></div></main>
<script type="module" src="popup.js"></script>
</body>
</html>
